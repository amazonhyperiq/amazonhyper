<!DOCTYPE html>

    <style>
        :root {
            --primary-color: #232f3e;
            --secondary-color: #febd69;
            --accent-color: #f3a847;
            --bg-color: #f3f3f3;
            --text-color: #111;
            --white: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
        }
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--secondary-color);
        }
        .cart-btn {
            background-color: var(--secondary-color);
            color: var(--primary-color);
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .category-section {
            margin-bottom: 30px;
        }
        .category-title {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .product-card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-name {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 40px;
        }
        .product-price {
            color: #b12704;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .product-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .product-controls input {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .add-to-cart-btn {
            background-color: var(--accent-color);
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .add-to-cart-btn:hover {
            background-color: var(--secondary-color);
        }
        /* سلة المشتريات */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .cart-content {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .cart-items-list {
            list-style: none;
            margin-bottom: 15px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .checkout-btn {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

        let cart = [];

        function renderStore() {
            const container = document.getElementById('store-container');
            container.innerHTML = '';

            defaultStoreData.forEach((cat, catIndex) => {
                let sectionHTML = `
                    <div class="category-section">
                        <div class="category-title">${cat.category}</div>
                        <div class="products-grid">
                `;

                cat.products.forEach((prod, prodIndex) => {
                    sectionHTML += `
                        <div class="product-card">
                            <div>
                                <div class="product-name">${prod.name}</div>
                                <div class="product-price">${prod.price} د.ع</div>
                            </div>
                            <div class="product-controls">
                                <input type="number" id="qty-${catIndex}-${prodIndex}" value="${cat.isWeight ? '1' : '1'}" step="${cat.isWeight ? '0.25' : '1'}" min="${cat.isWeight ? '0.25' : '1'}">
                                <button class="add-to-cart-btn" onclick="addToCart('${cat.category}', '${prod.name}', ${prod.price}, ${catIndex}, ${prodIndex})">إضافة للسلة</button>
                            </div>
                        </div>
                    `;
                });

                sectionHTML += `</div></div>`;
                container.innerHTML += sectionHTML;
            });
        }

        function addToCart(categoryName, productName, productPrice, catIndex, prodIndex) {
            const qtyInput = document.getElementById(`qty-${catIndex}-${prodIndex}`);
            const quantity = parseFloat(qtyInput.value) || 1;

            const existingItem = cart.find(item => item.name === productName);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    category: categoryName,
                    name: productName,
                    price: productPrice,
                    quantity: quantity
                });
            }

            updateCartUI();
            alert(`تمت إضافة ${productName} إلى السلة`);
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cart-count');
            const cartItemsList = document.getElementById('cartItemsList');
            const cartTotal = document.getElementById('cartTotal');

            let totalCount = 0;
            let totalPrice = 0;
            let listHTML = '';

            cart.forEach((item, index) => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;
                listHTML += `
                    <li class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>${item.quantity} × ${item.price} د.ع</small>
                        </div>
                        <button onclick="removeItem(${index})" style="background:#ff4d4d; color:white; border:none; padding:4px 8px; border-radius:3px; cursor:pointer;">حذف</button>
                    </li>
                `;
            });

            cartCount.innerText = totalCount;
            cartItemsList.innerHTML = listHTML || '<li style="text-align:center; color:#775050;">السلة فارغة</li>';
            cartTotal.innerText = totalPrice;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let message = "مرحباً، أود طلب المنتجات التالية من أمازون هايبر ماركت:\n\n";
            let totalPrice = 0;

            cart.forEach(item => {
                let itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;
                message += `- ${item.name} | الكمية: ${item.quantity} | السعر: ${itemTotal} د.ع\n`;
            });

            message += `\nالمجموع الكلي: ${totalPrice} د.ع`;

            // استبدال برقم الواتساب الخاص بك إذا لزم الأمر
            const phoneNumber = "9647700000000"; 
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        }

        // تشغيل المتجر عند التحميل
        window.onload = renderStore;
    </script>
</body>
</html>
