<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمازون هايبر ماركت</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: #eaeded; color: #111; direction: rtl; }
        header { background: #131921; color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; color: #febd69; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .card h3 { font-size: 16px; margin-bottom: 5px; }
        .price { color: #B12704; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        button { background: #ffd814; border: 1px solid #fcd200; padding: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #f7ca00; }
        .cart-section { background: #fff; padding: 20px; margin-top: 30px; border-radius: 8px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .whatsapp-btn { background: #25d366; color: white; border: none; margin-top: 15px; }
        .whatsapp-btn:hover { background: #1ebe5d; }
    </style>
</head>
<body>

    <header>
        <div class="logo">أمازون هايبر ماركت</div>
        <a href="admin.html" style="color: #febd69; text-decoration: none; font-size: 14px;">لوحة التحكم</a>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 15px;">المنتجات المتوفرة</h2>
        <div class="grid" id="productsGrid">
            <!-- يتم تعبئتها برمجياً -->
        </div>

        <div class="cart-section">
            <h2>سلة التسوق</h2>
            <div id="cartItems" style="margin-top: 15px;">
                <p>السلة فارغة</p>
            </div>
            <h3 id="cartTotal" style="margin-top: 15px;">المجموع: 0 د.ع</h3>
            <button class="whatsapp-btn" onclick="sendToWhatsApp()">إرسال الطلب عبر واتساب</button>
        </div>
    </div>

    <script>
        // ضع بيانات الاتصال الخاصة بـ Supabase هنا (نفس المفاتيح)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cart = [];

        async function loadStoreProducts() {
            const { data, error } = await _supabase.from('products').select('*');
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(p => {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}">
                            <h3>${p.name}</h3>
                            <div class="price">${p.price} د.ع</div>
                            <button onclick="addToCart('${p.name}', ${p.price})">إضافة إلى السلة</button>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<p>لا توجد منتجات معروضة حالياً.</p>';
            }
        }

        function addToCart(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            if (cart.length === 0) {
                container.innerHTML = '<p>السلة فارغة</p>';
                totalEl.innerText = 'المجموع: 0 د.ع';
                return;
            }
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name} (×${item.qty})</span>
                        <span>${item.price * item.qty} د.ع</span>
                    </div>
                `;
            });
            totalEl.innerText = `المجموع: ${total} د.ع`;
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert('السلة فارغة، يرجى اختيار منتجات أولاً.');
                return;
            }
            let message = 'مرحباً، أود طلب المنتجات التالية من أمازون هايبر ماركت:%0A';
            let total = 0;
            cart.forEach(item => {
                message += `- ${item.name} (الكمية: ${item.qty}) - السعر: ${item.price * item.qty} د.ع%0A`;
                total += item.price * item.qty;
            });
            message += `%0A*المجموع الكلي: ${total} د.ع*`;
            
            // استبدل الرقم أدناه برقم الواتساب الخاص بك (مثلاً: 9647700000000+)
            const phone = '964XXXXXXXXXXXXXXXXX'; 
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        loadStoreProducts();
    </script>
</body>
</html>
