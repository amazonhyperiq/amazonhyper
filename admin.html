    <style>
        :root {
            --primary-color: #232f3e;
            --secondary-color: #febd69;
            --bg-color: #f3f3f3;
            --white: #ffffff;
            --danger: #d9534f;
            --success: #5cb85c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-color); color: #111; padding: 20px; }
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        header h1 { font-size: 1.3rem; color: var(--secondary-color); }
        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 15px; font-size: 1.1rem; color: var(--primary-color); }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input, select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 150px;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background-color: var(--secondary-color); color: var(--primary-color); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: var(--white);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: right;
            font-size: 0.9rem;
        }
        th { background-color: var(--primary-color); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>

        function initDashboard() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '';
            storeData.forEach((cat, index) => {
                select.innerHTML += `<option value="${index}">${cat.category}</option>`;
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '';

            storeData.forEach((cat, catIndex) => {
                cat.products.forEach((prod, prodIndex) => {
                    let priceVal = prod.price !== null ? prod.price : '';
                    tbody.innerHTML += `
                        <tr>
                            <td>${cat.category}</td>
                            <td><input type="text" value="${prod.name}" id="name-${catIndex}-${prodIndex}" style="width:100%; border:none; background:transparent;"></td>
                            <td><input type="number" value="${priceVal}" id="price-${catIndex}-${prodIndex}" placeholder="بلا سعر" style="width:120px;"></td>
                            <td>
                                <button class="btn-primary" onclick="updateProduct(${catIndex}, ${prodIndex})">تحديث</button>
                                <button class="btn-danger" onclick="deleteProduct(${catIndex}, ${prodIndex})">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function addProduct() {
            const catIndex = document.getElementById('categorySelect').value;
            const name = document.getElementById('newProductName').value.trim();
            const priceInput = document.getElementById('newProductPrice').value.trim();

            if (!name) {
                alert('الرجاء إدخال اسم المادة.');
                return;
            }

            const price = priceInput !== '' ? parseFloat(priceInput) : null;

            storeData[catIndex].products.push({ name, price });
            saveAndRefresh();
            document.getElementById('newProductName').value = '';
            document.getElementById('newProductPrice').value = '';
            alert('تمت إضافة المنتج أو المادة بنجاح!');
        }

        function updateProduct(catIndex, prodIndex) {
            const newName = document.getElementById(`name-${catIndex}-${prodIndex}`).value.trim();
            const priceInput = document.getElementById(`price-${catIndex}-${prodIndex}`).value.trim();

            if (!newName) {
                alert('اسم المادة لا يمكن أن يكون فارغاً.');
                return;
            }

            storeData[catIndex].products[prodIndex].name = newName;
            storeData[catIndex].products[prodIndex].price = priceInput !== '' ? parseFloat(priceInput) : null;
            
            saveAndRefresh();
            alert('تم التحديث بنجاح!');
        }

        function deleteProduct(catIndex, prodIndex) {
            if (confirm('هل أنت متأكد من حذف هذه المادة؟')) {
                storeData[catIndex].products.splice(prodIndex, 1);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('amazonStoreData', JSON.stringify(storeData));
            renderTable();
        }
