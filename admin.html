<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم أمازون هايبر ماركت</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #ff6600;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #e55b00;
        }
        .success-msg {
            margin-top: 15px;
            padding: 10px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم أمازون هايبر ماركت</h2>
    <div class="form-group">
        <label for="productSelect">اختر المنتج لتعديل السعر:</label>
        <select id="productSelect">
            <option value="0">لحم عجل هندي طازج (كيلو) - 14,000 د.ع</option>
            <option value="1">صص / كص لحم (كيلو) - 16,000 د.ع</option>
            <option value="2">لحم غنم عراقي - 18,000 د.ع</option>
        </select>
    </div>

    <div class="form-group">
        <label for="newPrice">السعر الجديد (د.ع):</label>
        <input type="number" id="newPrice" placeholder="أدخل السعر الجديد هنا">
    </div>

    <button onclick="updatePrice()">حفظ وتحديث السعر</button>
    <div id="successMsg" class="success-msg">تم تحديث السعر وحفظه بنجاح!</div>
</div>

<script>
    function updatePrice() {
        const select = document.getElementById('productSelect');
        const price = document.getElementById('newPrice').value;
        const msg = document.getElementById('successMsg');

        if(!price) {
            alert('الرجاء إدخال السعر بشكل صحيح');
            return;
        }

        // حفظ التحديث في الذاكرة المحلية للمتصفح ليظهر في المتجر فوراً
        let pricesData = JSON.parse(localStorage.getItem('storePrices')) || {};
        pricesData[select.value] = price;
        localStorage.setItem('storePrices', JSON.stringify(pricesData));

        msg.style.display = 'block';
        setTimeout(() => {
            msg.style.display = 'none';
        }, 3000);
    }
</script>

</body>
</html>
