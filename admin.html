<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - أمازون هايبر ماركت</title>
    <style>
        :root {
            --primary-color: #232f3e;
            --secondary-color: #febd69;
            --bg-color: #f3f3f3;
            --white: #ffffff;
            --danger: #d9534f;
            --success: #5cb85c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-color); color: #111; padding: 20px; }
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        header h1 { font-size: 1.3rem; color: var(--secondary-color); }
        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 15px; font-size: 1.1rem; color: var(--primary-color); }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        input, select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 150px;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background-color: var(--secondary-color); color: var(--primary-color); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: var(--white);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: right;
            font-size: 0.9rem;
        }
        th { background-color: var(--primary-color); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <header>
        <h1>لوحة تحكم أمازون هايبر ماركت</h1>
        <a href="index.html" target="_blank" style="color: var(--secondary-color); text-decoration: none; font-weight: bold;">عرض المتجر 🛒</a>
    </header>

    <!-- إضافة منتج جديد -->
    <div class="card">
        <h2>إضافة منتج جديد</h2>
        <div class="form-group">
            <select id="categorySelect">
                <!-- تعبئة الأقسام تلقائياً -->
            </select>
            <input type="text" id="newProductName" placeholder="اسم المنتج الجديد">
            <input type="number" id="newProductPrice" placeholder="السعر (د.ع)">
            <button class="btn-success" onclick="addProduct()">إضافة المنتج</button>
        </div>
    </div>

    <!-- إدارة المنتجات الحالية -->
    <div class="card">
        <h2>قائمة المنتجات الحالية</h2>
        <div style="overflow-x: auto;">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>القسم</th>
                        <th>اسم المنتج</th>
                        <th>السعر (د.ع)</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <!-- يتم جلب المنتجات هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // جلب البيانات من التخزين المحلي أو الاعتماد على القائمة الافتراضية
        let storeData = JSON.parse(localStorage.getItem('amazonStoreData')) || [
            {
                category: "قسم اللحوم الطازجة",
                isWeight: true,
                products: [
                    { name: "لحم عجل عراقي طازج (كيلو)", price: 18500 },
                    { name: "لحم غنم عراقي طازج (كيلو)", price: 22000 },
                    { name: "لحم مثروم عجل طازج (كيلو)", price: 19000 },
                    { name: "كص لحم عراقي (كيلو)", price: 23000 }
                ]
            },
            {
                category: "قسم الدجاج الفريش",
                isWeight: true,
                products: [
                    { name: "دجاج ذبح عراقي", price: 5750 },
                    { name: "صدر دجاج عراقي", price: 8000 },
                    { name: "أجنحة", price: 5500 },
                    { name: "أفخاذ", price: 6000 },
                    { name: "كبدة", price: 6000 },
                    { name: "مثروم دجاج", price: 9000 }
                ]
            },
            {
                category: "قسم المواد الغذائية",
                isWeight: false,
                products: [
                    { name: "رز محمود 4.5 كيلو", price: 12500 },
                    { name: "رز محمود 9 كيلو", price: 24000 },
                    { name: "زيت عافية 1.5 لتر", price: 4750 },
                    { name: "سكر 1 كيلو", price: 1500 }
                ]
            }
        ];

        function initDashboard() {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '';
            storeData.forEach((cat, index) => {
                select.innerHTML += `<option value="${index}">${cat.category}</option>`;
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '';

            storeData.forEach((cat, catIndex) => {
                cat.products.forEach((prod, prodIndex) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${cat.category}</td>
                            <td><input type="text" value="${prod.name}" id="name-${catIndex}-${prodIndex}" style="width:100%; border:none; background:transparent;"></td>
                            <td><input type="number" value="${prod.price}" id="price-${catIndex}-${prodIndex}" style="width:100px;"></td>
                            <td>
                                <button class="btn-primary" onclick="updateProduct(${catIndex}, ${prodIndex})">تعديل</button>
                                <button class="btn-danger" onclick="deleteProduct(${catIndex}, ${prodIndex})">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function addProduct() {
            const catIndex = document.getElementById('categorySelect').value;
            const name = document.getElementById('newProductName').value.trim();
            const price = parseFloat(document.getElementById('newProductPrice').value);

            if (!name || isNaN(price)) {
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح.');
                return;
            }

            storeData[catIndex].products.push({ name, price });
            saveAndRefresh();
            document.getElementById('newProductName').value = '';
            document.getElementById('newProductPrice').value = '';
            alert('تمت إضافة المنتج بنجاح!');
        }

        function updateProduct(catIndex, prodIndex) {
            const newName = document.getElementById(`name-${catIndex}-${prodIndex}`).value.trim();
            const newPrice = parseFloat(document.getElementById(`price-${catIndex}-${prodIndex}`).value);

            if (!newName || isNaN(newPrice)) {
                alert('الرجاء التأكد من صحة البيانات.');
                return;
            }

            storeData[catIndex].products[prodIndex].name = newName;
            storeData[catIndex].products[prodIndex].price = newPrice;
            saveAndRefresh();
            alert('تم التعديل بنجاح!');
        }

        function deleteProduct(catIndex, prodIndex) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                storeData[catIndex].products.splice(prodIndex, 1);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('amazonStoreData', JSON.stringify(storeData));
            renderTable();
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
